<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0F0C22">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Yayındasın: Spikerlik ve Sunuculuk Simülasyonu</title>
<link rel="stylesheet" href="fonts/archivo.css">
<script src="config.js"></script>
<script src="platform.js"></script>
<style>
:root{
  --bg:#E9ECF2;--surface:#FFFFFF;--surface2:#F2F4F8;--ink:#141726;--muted:#596076;--line:#D3D8E3;
  --tally:#D42A24;--chroma:#0C9A5E;--amber:#B98400;--mon:#0E1120;--monInk:#EEF0F8;--monMuted:#8D95B1;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F111B;--surface:#191C2A;--surface2:#212536;--ink:#ECEEF6;--muted:#9CA2BA;--line:#2C3147;
  --tally:#F0463F;--chroma:#2DCB85;--amber:#F0B522;--mon:#080A12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F111B;--surface:#191C2A;--surface2:#212536;--ink:#ECEEF6;--muted:#9CA2BA;--line:#2C3147;
  --tally:#F0463F;--chroma:#2DCB85;--amber:#F0B522;--mon:#080A12;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
.app{max-width:440px;margin:0 auto;padding:12px 16px 104px}
h1,h2,h3{margin:0;font-weight:800}
.x{font-stretch:125%}
.c{font-stretch:75%}
.lead{color:var(--muted);margin:0 0 14px;max-width:60ch}
.note{color:var(--muted);font-size:14px}
.h3{font-size:17px;font-stretch:112%;margin:26px 0 8px}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:10px;font-stretch:125%;font-weight:850;font-size:21px;letter-spacing:-.01em}
.tally{width:12px;height:12px;border-radius:50%;background:var(--tally);box-shadow:0 0 0 4px color-mix(in srgb,var(--tally) 22%,transparent);flex:none}
.trrow{display:flex;gap:8px}.trrow input{flex:1;min-width:0}
.lvlpill{font-stretch:75%;font-weight:700;font-size:14px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}

/* monitor hero */
.monitor{background:var(--mon);color:var(--monInk);border-radius:20px;padding:18px 18px 16px;position:relative;overflow:hidden}
.monitor .cap{font-stretch:75%;color:var(--monMuted);font-size:14px}
.monitor .title{font-stretch:125%;font-weight:900;font-size:30px;line-height:1.02;letter-spacing:-.02em;margin:6px 0 14px}
.xpbar{height:8px;border-radius:4px;background:#ffffff1f;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--chroma),var(--amber))}
.xprow{display:flex;justify-content:space-between;font-stretch:75%;font-size:14px;color:var(--monMuted);margin-top:8px}
.vu{position:absolute;right:16px;top:16px;display:flex;gap:3px;align-items:flex-end;height:26px}
.vu span{width:4px;border-radius:2px;background:var(--chroma)}
.vu span:nth-child(n+5){background:var(--amber)}.vu span:nth-child(n+7){background:var(--tally)}
.golive{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;background:var(--tally);color:#fff;border:0;border-radius:14px;padding:14px 16px;width:100%;text-align:left}
.golive b{font-stretch:125%;font-size:17px;display:block}
.golive small{opacity:.85}
.golive .rec{width:34px;height:34px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;flex:none}
.golive .rec::after{content:"";width:14px;height:14px;border-radius:50%;background:#fff}

/* rundown */
.sec{margin:26px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec h2{font-size:19px;font-stretch:112%}
.sec span{font-stretch:75%;color:var(--muted);font-size:14px}
.rundown{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rd{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:13px 14px;border:0;background:none;width:100%;text-align:left;border-top:1px solid var(--line)}
.rd:first-child{border-top:0}
.rd time{font-stretch:75%;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.rd b{display:block;font-weight:700}
.rd small{color:var(--muted)}
.st{font-stretch:75%;font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.st.ok{background:color-mix(in srgb,var(--chroma) 18%,transparent);color:var(--chroma)}
.st.now{background:var(--tally);color:#fff}

/* module list */
.group{margin-top:22px}
.group h2{font-size:15px;font-stretch:100%;color:var(--muted);font-weight:700;margin:0 0 8px 2px}
.list{display:grid;gap:8px}
.row{display:flex;gap:12px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;text-align:left}
.ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:21px;background:var(--surface2);flex:none}
.row b{display:block;font-weight:700}
.row small{color:var(--muted);display:block;line-height:1.3}
.row .xp{margin-left:auto;font-stretch:75%;font-weight:700;color:var(--muted);font-size:14px;white-space:nowrap}
.row .xp.ok{color:var(--chroma)}
.pagehead{padding:4px 0 2px}
.pagehead h1{font-size:28px;font-stretch:125%;letter-spacing:-.02em;line-height:1.05}
.pagehead p{color:var(--muted);margin:6px 0 0}

/* tabbar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;padding:10px 0 9px;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
.tabs button span{font-size:20px;line-height:1}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] span{filter:none}

/* sheet */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet[hidden]{display:none}
.sheet .inner{max-width:440px;margin:0 auto;padding:10px 16px 48px}
.shead{display:flex;align-items:center;gap:10px;padding:4px 0 14px}
.back{white-space:nowrap;flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px 7px 11px;font-weight:600}
.shead h1{font-size:23px;font-stretch:125%;letter-spacing:-.015em;line-height:1.05}

/* controls */
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:12px 20px;font-weight:700}
.btn.rec{background:var(--tally);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
label.f{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
input[type=range]{width:100%;accent-color:var(--tally)}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
textarea{min-height:90px;resize:vertical}
.mic{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.mic .ok{color:var(--chroma);font-weight:700;font-size:14px}
.mic input[type=range]{flex:1 1 100%}

.meter{height:16px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);position:relative;overflow:hidden}
.meter.big{height:30px;border-radius:10px}
.meter i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--chroma),var(--amber) 70%,var(--tally))}
.meter .zone{position:absolute;top:0;bottom:0;border-left:2px dashed var(--chroma);border-right:2px dashed var(--chroma);background:color-mix(in srgb,var(--chroma) 12%,transparent);z-index:1}
.scale{display:flex;justify-content:space-between;font-stretch:75%;font-size:13px;color:var(--muted);margin-top:4px}
.kpi{display:flex;align-items:baseline;gap:8px;margin:16px 0 4px}
.kpi b{font-stretch:125%;font-weight:900;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted)}
.cue{font-weight:700;margin:6px 0 0}

/* breath */
.breathwrap{display:grid;place-items:center;height:250px}
.breath{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--chroma) 55%,var(--surface)),var(--chroma));display:grid;place-items:center;align-content:center;color:#fff;transform:scale(.55);transition:transform 1s ease-in-out}
.breath span{font-stretch:125%;font-weight:850;font-size:20px}
.breath small{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}

/* steps */
.steps{display:grid;gap:8px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.steps li::before{content:counter(s);font-stretch:75%;font-weight:800;color:var(--muted)}
.steps li small{font-stretch:75%;color:var(--muted);font-variant-numeric:tabular-nums}
.steps li.on{border-color:var(--tally);box-shadow:inset 4px 0 0 var(--tally)}
.steps li.dn{opacity:.55}

/* big text cards */
.say{background:var(--mon);color:var(--monInk);border-radius:18px;padding:22px 18px;font-size:22px;line-height:1.4;font-weight:600;min-height:150px}
.say .w{transition:color .1s;color:var(--monMuted)}
.say .w.hi{color:#fff;text-decoration:underline;text-decoration-color:var(--amber);text-underline-offset:5px;text-decoration-thickness:3px}
.say .w.rd{color:var(--monInk)}
.emo{font-stretch:125%;font-weight:900;font-size:40px;letter-spacing:-.02em;line-height:1}

/* quiz */
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin:0 0 8px;font-weight:600}
.opt.right{border-color:var(--chroma);background:color-mix(in srgb,var(--chroma) 14%,var(--surface))}
.opt.wrong{border-color:var(--tally);background:color-mix(in srgb,var(--tally) 12%,var(--surface))}
.explain{background:var(--surface2);border-radius:12px;padding:12px 14px;margin:6px 0 12px}

/* yes no */
.ynq{min-height:220px;display:flex;flex-direction:column;justify-content:space-between}
.ynq .hl{font-stretch:112%;font-weight:800;font-size:22px;line-height:1.2}
.ynq .ask{color:var(--monMuted);margin-top:14px;font-size:17px}
.ynbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.ynbtns button{border:0;border-radius:16px;padding:18px 0;font-stretch:125%;font-weight:900;font-size:22px;color:#fff}
.ynbtns .no{background:var(--tally)}.ynbtns .yes{background:var(--chroma)}
.tbar{height:5px;background:#ffffff22;border-radius:3px;overflow:hidden;margin-top:14px}
.tbar i{display:block;height:100%;background:var(--amber);width:100%}

/* prompter */
.prompter{position:relative;height:56vh;min-height:320px;background:var(--mon);border-radius:18px;overflow:hidden}
.prompter .txt{position:absolute;left:0;right:0;padding:0 20px;color:#fff;font-weight:700;line-height:1.35;will-change:transform}
.prompter .guide{position:absolute;left:0;right:0;top:38%;height:2px;background:var(--tally);opacity:.8;z-index:2}
.prompter .guide::before{content:"";position:absolute;left:4px;top:-7px;border:8px solid transparent;border-left:12px solid var(--tally)}
.prompter::after{content:"";position:absolute;inset:0;background:linear-gradient(var(--mon),transparent 22%,transparent 70%,var(--mon));pointer-events:none}
.prompter.mirror .txt{transform-origin:center;scale:-1 1}
.ctrl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin:10px 0}
.ctrl span{font-stretch:75%;font-weight:700;font-size:14px;min-width:66px}
.ctrl output{font-stretch:75%;font-variant-numeric:tabular-nums;font-weight:700;min-width:28px;text-align:right}

/* countdown */
.cd{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#000c;color:#fff;font-stretch:125%;font-weight:900;font-size:140px}

/* breaking */
.breaking{background:var(--mon);color:#fff;border-radius:18px;overflow:hidden}
.breaking .bn{display:flex;align-items:stretch}
.breaking .bn b{background:var(--tally);padding:10px 14px;font-stretch:125%;font-weight:900;font-size:18px;letter-spacing:.01em}
.breaking .bn span{background:#fff;color:#111;padding:10px 12px;font-weight:800;flex:1;font-stretch:90%;display:flex;align-items:center}
.breaking .body{padding:18px;font-size:20px;line-height:1.45;font-weight:600}
.breaking .meta{display:flex;justify-content:space-between;padding:0 18px 14px;color:var(--monMuted);font-stretch:75%;font-variant-numeric:tabular-nums}
.onair{display:inline-flex;align-items:center;gap:8px;background:var(--tally);color:#fff;border-radius:6px;padding:4px 10px;font-stretch:125%;font-weight:900;font-size:14px}
.onair::before{content:"";width:8px;height:8px;border-radius:50%;background:#fff}

/* studio */
.studio{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;container-type:inline-size}
.studio .bgl{position:absolute;inset:0}
.studio .bgl svg{width:100%;height:100%;display:block}
.studio canvas{position:absolute;inset:0;width:100%;height:100%}
.studio canvas.framed{inset:12% 6% auto auto;width:42%;height:auto;aspect-ratio:16/9;border-radius:6px;box-shadow:0 0 0 2px #fff6}
.studio .sil{position:absolute;left:50%;bottom:0;width:34%;translate:-50% 0}
.studio .lt{position:absolute;left:4%;bottom:17%;max-width:70%}
.studio .lt b{display:block;background:var(--tally);color:#fff;font-stretch:125%;font-weight:900;font-size:4.2cqw;padding:.6cqw 2cqw;line-height:1.15}
.studio .lt span{display:inline-block;background:#fff;color:#111;font-weight:700;font-size:2.8cqw;padding:.5cqw 2cqw}
.studio .tk{position:absolute;left:0;right:0;bottom:0;height:9%;background:#0b1530e6;display:flex;align-items:center;overflow:hidden;font-size:2.8cqw;color:#fff;font-weight:600}
.studio .tk b{background:var(--amber);color:#111;height:100%;display:flex;align-items:center;padding:0 2cqw;font-stretch:125%;font-weight:900;flex:none;z-index:1}
.studio .tk .mq{white-space:nowrap;padding-left:100%;animation:mq 26s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
.studio .badge{position:absolute;left:3%;top:5%;font-size:2.6cqw}
.studio .clock{position:absolute;right:3%;top:5%;background:#000a;color:#fff;font-stretch:75%;font-weight:700;font-size:2.8cqw;padding:.4cqw 1.4cqw;border-radius:4px;font-variant-numeric:tabular-nums}
.mini{background:var(--mon);color:#fff;border-radius:14px;height:120px;overflow:hidden;position:relative;margin-top:10px}
.mini .txt{position:absolute;left:0;right:0;padding:10px 16px;font-size:19px;font-weight:700;line-height:1.35}

/* dub */
.scene{border-radius:16px;overflow:hidden;aspect-ratio:16/9;position:relative;background:var(--mon)}
.scene svg{width:100%;height:100%;display:block}
.tl{height:6px;background:var(--surface2);border-radius:3px;margin:12px 0;position:relative;overflow:hidden}
.tl i{position:absolute;inset:0 auto 0 0;background:var(--tally);width:0}
.lines{display:grid;gap:6px}
.ln{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.ln time{font-stretch:75%;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.ln em{font-style:normal;color:var(--muted);font-size:14px;display:block}
.ln.on{border-color:var(--tally);box-shadow:inset 4px 0 0 var(--tally)}
audio{width:100%;margin-top:10px}

/* profile */
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bd{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;font-size:12px;line-height:1.2;color:var(--muted)}
.bd span{display:block;font-size:24px;margin-bottom:4px;filter:grayscale(1);opacity:.4}
.bd.on{color:var(--ink);border-color:color-mix(in srgb,var(--chroma) 50%,var(--line))}
.bd.on span{filter:none;opacity:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stats b{display:block;font-stretch:125%;font-weight:900;font-size:24px;font-variant-numeric:tabular-nums}
.stats small{color:var(--muted)}

.check{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:8px}
.check input{width:22px;height:22px;accent-color:var(--chroma);margin:2px 0 0}
.check small{display:block;color:var(--muted);font-stretch:75%;font-weight:700;margin-top:4px}
.check.dn{opacity:.6}

.req{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.req.ok{border-color:color-mix(in srgb,var(--chroma) 55%,var(--line));box-shadow:inset 4px 0 0 var(--chroma)}
.req h3{font-size:16px;margin:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;line-height:1.3}
.req h3 .tag{flex:none;margin:0}
.req .hint{color:var(--muted);font-size:14px;margin:4px 0 10px}
.req .chips{margin:0}
.req label.cn{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;font-weight:600}
.req label.cn input{width:20px;height:20px;accent-color:var(--chroma);margin:2px 0 0}
.req .cnt{font-stretch:75%;font-size:13px;color:var(--muted);text-align:right;margin-top:4px}
.pf{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.pf .top2{display:flex;align-items:center;gap:8px}
.pf .top2 span{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf .rm{border:0;background:none;color:var(--muted);font-size:14px;font-weight:700;padding:4px 6px}
.pf img,.pf video{display:block;width:100%;max-height:220px;object-fit:contain;background:var(--mon);border-radius:10px;margin-top:8px}
.pf audio{margin-top:8px}
label.btn input{display:none}
label.btn{display:inline-block;cursor:pointer}
.scene .sv{position:absolute;inset:0}
.scene svg{transform-origin:50% 55%}
.scene.playing svg{animation:kb var(--d,20s) linear forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12) translate(-1.5%,-1%)}}
.scene .bob{animation:bob 1.5s ease-in-out infinite}.scene .b2{animation-delay:-.7s}
.scene .sway{animation:sway 2.6s ease-in-out infinite}
.scene .lamp{animation:lamp 3.2s ease-in-out infinite}
.scene .tw{animation:tw 2s ease-in-out infinite}
.scene .rise{animation:rise 2.6s ease-out infinite}
.scene .wave{animation:wv 3s ease-in-out infinite}.scene .w2{animation-delay:-1.4s}
.scene .fly{animation:fly 14s linear infinite}
.scene .fall{animation:fall 6s ease-in infinite}
.scene .drift{animation:drift 9s ease-in-out infinite alternate}
.scene .depart{animation:depart var(--d,20s) ease-in forwards}
.scene .bob,.scene .sway,.scene .lamp,.scene .tw,.scene .rise,.scene .wave,.scene .fly,.scene .fall,.scene .drift,.scene .depart{animation-play-state:paused;transform-box:fill-box;transform-origin:center}
.scene .lamp,.scene .fly,.scene .fall,.scene .depart,.scene .drift{transform-box:view-box}
.scene .lamp{transform-origin:160px 0}

 sk_lead:['Bu haftanın görevleri. Telefonu al, sokağa çık; her görev içeriğine uygun kanıtla tamamlanır. Birini kaydetmeden önce mutlaka izin iste.','Bu həftənin tapşırıqları. Telefonu götür, küçəyə çıx; hər tapşırıq məzmununa uyğun sübutla tamamlanır. Kimisə qeydə almadan əvvəl mütləq icazə istə.','Осы аптаның тапсырмалары. Телефонды алып, көшеге шық; әр тапсырма мазмұнына сай дәлелмен аяқталады. Біреуді жазбас бұрын міндетті түрде рұқсат сұра.','Ушул жуманын тапшырмалары. Телефонду алып, көчөгө чык; ар бир тапшырма мазмунуна ылайык далил менен бүтөт. Бирөөнү жаздырардан мурун сөзсүз уруксат сура.','Bu haftaning topshiriqlari. Telefonni olib, koʻchaga chiq; har bir topshiriq mazmuniga mos dalil bilan yakunlanadi. Kimnidir yozib olishdan oldin albatta ruxsat soʻra.','Şu hepdäniň ýumuşlary. Telefony al-da, köçä çyk; her ýumuş mazmunyna laýyk subutnama bilen tamamlanýar. Kimdir birini ýazga almazdan öň hökman rugsat sora.','This week’s tasks. Grab your phone and head out; each task is completed with proof that fits its content. Always ask for consent before recording anyone.'],

function tl(k,v){const a=L[k];let s=a?(a[LI()]||a[0]):k;if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s}
const lvName=i=>tl('lv'+i);

/* ---------- lifecycle ---------- */
let live=[];
const onClose=f=>live.push(f);
function loop(fn){let id,last=performance.now(),stopped=false;const t=now=>{if(stopped)return;const dt=Math.min(.1,(now-last)/1000);last=now;if(fn(dt,now)===false){stopped=true;return}id=requestAnimationFrame(t)};id=requestAnimationFrame(t);const stop=()=>{stopped=true;cancelAnimationFrame(id)};onClose(stop);return stop}
function after(ms,f){const id=setTimeout(f,ms);onClose(()=>clearTimeout(id));return id}
const sleep=ms=>new Promise(r=>after(ms,r));

/* ---------- mic / recorder / camera ---------- */
const Mic={an:null,stream:null,ctx:null,buf:null,sim:0,
  async start(){if(this.an)return true;try{this.stream=await navigator.mediaDevices.getUserMedia({audio:true});const AC=window.AudioContext||window.webkitAudioContext;this.ctx=new AC();const s=this.ctx.createMediaStreamSource(this.stream);this.an=this.ctx.createAnalyser();this.an.fftSize=1024;s.connect(this.an);this.buf=new Float32Array(this.an.fftSize);this.err=null;return true}catch(e){this.err=mediaErr(e,'microphone');return false}},
  level(){if(!this.an)return this.sim;this.an.getFloatTimeDomainData(this.buf);let s=0;for(let i=0;i<this.buf.length;i++)s+=this.buf[i]*this.buf[i];return Math.min(1,Math.sqrt(s/this.buf.length)*6)},
  stop(){if(this.stream)this.stream.getTracks().forEach(t=>t.stop());if(this.ctx)try{this.ctx.close()}catch(e){}this.an=this.stream=this.ctx=null;this.sim=0}};
const Rec={mr:null,chunks:[],
  start(){if(!Mic.stream||!window.MediaRecorder)return false;this.chunks=[];try{this.mr=new MediaRecorder(Mic.stream)}catch(e){return false}this.mr.ondataavailable=e=>{if(e.data.size)this.chunks.push(e.data)};this.mr.start();return true},

function micUI(box){

  const mb=$('[data-mic]',box);mb.onclick=async()=>{
    const ok=await Mic.start();
    if(ok){box.innerHTML='<span class="ok">● Mikrofon açık</span>';return}
    box.innerHTML=`<div class="note">${MEDIA_MSG[Mic.err]||MEDIA_MSG.other} Demo için sürgüyü ya da düğmeyi kullan.</div>
      <input type="range" min="0" max="100" value="0" data-sim aria-label="Demo ses seviyesi">
      <button class="btn ghost sm" data-hold>Basılı tut: sesli konuş</button>`;
    $('[data-sim]',box).oninput=e=>Mic.sim=e.target.value/100;
    const h=$('[data-hold]',box);
    h.onpointerdown=e=>{e.preventDefault();Mic.sim=.85};
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>h.addEventListener(ev,()=>Mic.sim=0));
  };
  if((S.perm==='granted'||S.perm==='mic')&&mediaPolicy('microphone')!==false)mb.click();

/* proof storage: IndexedDB on this device, memory fallback */
const DB={p:null,open(){if(!this.p)this.p=new Promise((res,rej)=>{try{const r=indexedDB.open('yayindasin-kanit',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return this.p},
 async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('f',mode);const q=fn(t.objectStore('f'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})}};
const MEM={};
async function blobGet(k){if(MEM[k])return MEM[k];try{const v=await DB.tx('readonly',s=>s.get(k));if(v)MEM[k]=v;return v||null}catch(e){return null}}
async function blobPut(k,v){MEM[k]=v;try{await DB.tx('readwrite',s=>s.put(v,k));return true}catch(e){return false}}
async function blobDel(k){delete MEM[k];try{await DB.tx('readwrite',s=>s.delete(k))}catch(e){}}
async function blobClear(){Object.keys(MEM).filter(k=>k.startsWith('port:')).forEach(k=>delete MEM[k]);try{const ks=await DB.tx('readonly',s=>s.getAllKeys());for(const k of ks||[])if(String(k).startsWith('port:'))await DB.tx('readwrite',s=>s.delete(k))}catch(e){}}

 el.onloadedmetadata=()=>{if(isFinite(el.duration))return done(el.duration);el.ontimeupdate=()=>{el.ontimeupdate=null;done(isFinite(el.duration)?el.duration:null)};try{el.currentTime=1e7}catch(e){done(null)}};el.onerror=()=>done(null);setTimeout(()=>done(null),5000);el.src=u})}

const PACKS={prompter:['TEXTS'],sondakika:['BREAKING'],gol:['GOALS'],evethayir:['YN'],duygu:['EMOS','EMO_SENT'],mimik:['BAIT'],artikulasyon:['ART'],videolar:['LESSONS'],haber:['BULTEN'],spor:['BULTEN'],seslendirme:['DUB'],animasyon:['DUB'],belgesel:['DUB'],reklam:['DUB'],sunum:['SUNUM']};
const KEEP=['v','m','bgs','id'];
function mergeTr(o,t,k){if(KEEP.includes(k))return o;if(typeof o==='string')return(o.length<=2||typeof t!=='string'||!t.trim())?o:t;if(typeof o!=='object'||o===null)return o;
 if(Array.isArray(o))return o.map((x,i)=>mergeTr(x,Array.isArray(t)?t[i]:undefined));const r={};for(const key in o)r[key]=mergeTr(o[key],t&&typeof t==='object'?t[key]:undefined,key);return r}
/* ---------- translation engine: chunked, fast tier, DOM fallback for every visible string ---------- */
const PK_MEM={};
let trBlocked=false,trPauseUntil=0;
function C(n){if(S.lang&&S.lang!=='tr'){const k=S.lang+':'+n;const v=(S.pk&&S.pk[k])||PK_MEM[k];if(v)return v}return BASE[n]}
function uiMap(){S.ui=S.ui||{};return S.ui[S.lang]=S.ui[S.lang]||{}}
function eachStr(o,f,k){if(KEEP.includes(k))return;if(typeof o==='string')f(o);else if(o&&typeof o==='object')for(const key in o)eachStr(o[key],f,key)}
function seedIdentity(o){const m=uiMap();eachStr(o,s=>{const t=s.trim();if(t)m[t]=t})}
function trErr(e){const c=e&&e.code;if(c==='not_granted'||c==='unavailable'){if(!trBlocked)toast(tl('tr_denied'));trBlocked=true}else if(c==='rate_limited'||c==='usage_limited'||c==='quota_exceeded'){if(Date.now()>trPauseUntil)toast(tl('tr_limit'));trPauseUntil=Date.now()+60000}else trPauseUntil=Date.now()+15000}
function trJSON(sm,data,hint){return sm.json(`Translate every human-readable Turkish string value in this JSON into ${LANGS[LI()][1]} (language code: ${S.lang}). Context: ${hint}
- Use Cyrillic script for Kazakh and Kyrgyz; Latin script for Azerbaijani, Uzbek and Turkmen.
- Keep the JSON structure, keys, numbers and array lengths exactly the same.
- Leave values of the keys "id", "v", "m", "bgs" and any 1–2 letter codes unchanged.
- If a string is already in the target language, return it unchanged.
Reply with only the translated JSON.
${JSON.stringify(data)}`,{modelTier:'quick',cache:false})}
function chunksOf(n){const d=BASE[n];if(Array.isArray(d)){const out=[];for(let i=0;i<d.length;i+=8)out.push({from:i,data:d.slice(i,i+8)});return out}return Object.keys(d).map(k=>({key:k,data:d[k]}))}
async function ensurePacks(names){S.pk=S.pk||{};const lang=S.lang;const need=names.filter(n=>!S.pk[lang+':'+n]);if(!need.length)return 'done';if(trBlocked)return 'none';const sm=await getSample();if(!sm)return 'none';
 let allOk=true;
 for(const n of need){const parts=chunksOf(n);
  const res=await Promise.all(parts.map(p=>trJSON(sm,p.data,'practice scripts of a TV/radio presenter training app; translate naturally in spoken broadcast style.').then(r=>({p,r})).catch(e=>{trErr(e);return{p,r:null}})));
  if(S.lang!==lang)return 'fail';
  const d=BASE[n],tr=Array.isArray(d)?[]:{};let ok=true;
  res.forEach(({p,r})=>{if(r==null){ok=false;return}
   if(p.key==null){const arr=Array.isArray(r)?r:(r&&Array.isArray(r.data)?r.data:null);if(!arr){ok=false;return}arr.forEach((x,j)=>tr[p.from+j]=x)}
   else tr[p.key]=(r&&typeof r==='object'&&!Array.isArray(r)&&Object.keys(r).length===1&&p.key in r)?r[p.key]:r});
  const merged=mergeTr(d,tr);seedIdentity(merged);
  if(ok)S.pk[lang+':'+n]=merged;else{PK_MEM[lang+':'+n]=merged;allOk=false}}
 save();return allOk?'done':'fail'}
async function ensureTr(tasks){if(S.lang==='tr')return 'cached';const lang=S.lang;const need=tasks.filter(x=>!S.trc[lang+':'+x.id]);if(!need.length)return 'cached';if(trBlocked)return 'none';const sm=await getSample();if(!sm)return 'none';
 const groups=[];for(let i=0;i<need.length;i+=3)groups.push(need.slice(i,i+3));let any=false;
 await Promise.all(groups.map(g=>trJSON(sm,g.map(x=>({id:x.id,t:x.t,tips:x.tips,req:x.req.map(r=>({l:r.l,h:r.h||'',o:r.o||[]}))})),'field practice tasks and tips for presenter students; clear, instructive tone.')
  .then(r=>{const arr=Array.isArray(r)?r:(r&&Array.isArray(r.data)?r.data:[]);arr.forEach(o=>{if(o&&o.id&&typeof o.t==='string'&&S.lang===lang){S.trc[lang+':'+o.id]=o;any=true;seedIdentity(o)}})}).catch(trErr)));
 save();return any?'done':'fail'}
/* DOM fallback: any Turkish text left on screen is queued, translated in small batches and cached */
const UIQ=new Set();let uiT=null,uiBusy=false;
const HAS_L=/[A-Za-zÇĞİÖŞÜçğıöşüÂâÎîÛû]/;
function trNode(n){if(!S.lang||S.lang==='tr')return;const raw=n.nodeValue;if(!raw)return;const s=raw.trim();if(s.length<2||!HAS_L.test(s))return;const m=uiMap();
 if(m[s]!=null){if(m[s]!==s){m[m[s].trim()]=m[s].trim();n.nodeValue=raw.replace(s,m[s])}return}UIQ.add(s);if(!uiT)uiT=setTimeout(flushTr,400)}
function okNode(n){const p=n.parentElement;return !!p&&!p.closest('[data-notr],script,style,textarea,select,option,audio,video,canvas,svg')}
function walkTr(root){if(!S.lang||S.lang==='tr'||!root)return;if(root.nodeType===3){if(okNode(root))trNode(root);return}if(root.nodeType!==1||root.closest('[data-notr]'))return;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>okNode(n)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});const ns=[];while(w.nextNode())ns.push(w.currentNode);ns.forEach(trNode)}
async function flushTr(){uiT=null;if(uiBusy||!UIQ.size)return;if(S.lang==='tr'||trBlocked){UIQ.clear();return}
 if(Date.now()<trPauseUntil){uiT=setTimeout(flushTr,trPauseUntil-Date.now()+200);return}
 const sm=await getSample();if(!sm){UIQ.clear();return}
 const lang=S.lang,items=[...UIQ].slice(0,50);items.forEach(s=>UIQ.delete(s));uiBusy=true;
 try{const r=await sm.json(`Translate each string of this JSON array from Turkish into ${LANGS[LI()][1]} (language code: ${lang}). They are interface labels and practice texts of a training app for TV and radio presenters. Use Cyrillic script for Kazakh and Kyrgyz; Latin script for Azerbaijani, Uzbek and Turkmen. Keep emojis, numbers, symbols and punctuation. If a string is already in the target language or is a proper name, return it unchanged. Reply with only a JSON array of the same length and order.
${JSON.stringify(items)}`,{modelTier:'quick',cache:false});
  if(Array.isArray(r)&&S.lang===lang){const m=uiMap();items.forEach((s,i)=>{const t=typeof r[i]==='string'&&r[i].trim()?r[i].trim():s;m[s]=t;m[t]=t});save();walkTr($('#app'));walkTr($('#sheet'));walkTr($('.gate'));walkTr($('#tabs'))}}
 catch(e){trErr(e)}
 finally{uiBusy=false;if(UIQ.size&&!uiT)uiT=setTimeout(flushTr,400)}}
function seedUI(){if(!S.lang||S.lang==='tr')return;const m=uiMap(),i=LI();for(const k in L){const v=L[k][i];if(v){m[v]=v;const t=v.trim();m[t]=t}}}
new MutationObserver(ms=>{if(!S.lang||S.lang==='tr')return;for(const mu of ms){if(mu.type==='characterData'){if(okNode(mu.target))trNode(mu.target)}else mu.addedNodes.forEach(walkTr)}}).observe(document.body,{subtree:true,childList:true,characterData:true});

/* ---------- daily content rotation + AI daily texts ---------- */
const DAILY_N={EMO_SENT:5,YN:10,BAIT:6,TWISTERS:6,GOALS:2,BREAKING:3};
const hashS=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
/* fixed shuffled order per pool; each day takes the next n items, so consecutive days never repeat */
function pickIdx(len,n,name){const r=rng(hashS(name));const a=[...Array(len).keys()];for(let i=len-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}n=Math.min(n,len);const st=(dayN()*n)%len;const out=[];for(let k=0;k<n;k++)out.push(a[(st+k)%len]);return out}
const daiKey=nm=>today()+':'+(nm==='TWISTERS'?'tr':(S.lang||'tr'))+':'+nm;
function D(name){const ai=S.dai&&S.dai[daiKey(name)];if(ai)return ai;const src=C(name);
 if(name==='BULTEN'){const o={};for(const k in src){const own=S.dai&&S.dai[daiKey('BULTEN_'+k)];const it=src[k].items;o[k]=Object.assign({},src[k],{items:own||pickIdx(it.length,4,'BULTEN_'+k).map(i=>it[i])})}return o}
 if(name==='TEXTS'){const ks=Object.keys(src);const o={};pickIdx(ks.length,3,'TEXTS').forEach(i=>o[ks[i]]=src[ks[i]]);return o}
 if(Array.isArray(src)&&DAILY_N[name])return pickIdx(src.length,DAILY_N[name],name).map(i=>src[i]);
 return src}

mod('sokak',{t:'Sokak görevleri',s:'Haftalık görevler, kanıt ve sesli anlatım',i:'🗺',xp:60,group:'saha',render(b){

 const genTask=async sm=>{if(gbusy)return;const btn=$('[data-gen]',b),gs=$('[data-gs]',b);gbusy=new AbortController();onClose(()=>gbusy&&gbusy.abort());btn.disabled=true;btn.textContent=tl('sk_genbusy');gs.hidden=true;const focus=$('#gfocus',b).value.trim();
  const prompt=`Sen spikerlik ve sunuculuk eğitmenisin. Öğrencin için sokakta ya da gündelik hayatta yapılabilecek ÖZGÜN bir alıştırma görevi yaz.
Zorluk: ${glv}.${focus?' Odak: '+focus+'.':''}

Kurallar:
- Güvenli, yasal ve kimseyi rahatsız etmeyen bir görev olsun; gerçek kişi ya da marka adı kullanma.

{"t":"görev tanımı, en fazla 30 kelime","tips":["","",""],"req":[]}`;

    if(q.k==='media'){const acc=ACC[q.tur]||'video/*,audio/*';const o={k:'media',l,h,acc,n:Math.min(3,Math.max(1,+q.n||1))};if(acc!=='image/*'){o.min=Math.min(120,Math.max(0,+q.min||0))||undefined;const mx=+q.max;if(mx>0&&mx>=(o.min||0))o.max=Math.min(180,mx)}if(acc.includes('audio'))o.rec=true;if(acc!=='audio/*')o.cap='environment';return o}return null}).filter(Boolean);

  }catch(e){gbusy=null;if(!b.isConnected||!$('[data-gen]',b))return;if(e&&e.code==='not_granted'){$('[data-genbox]',b).hidden=true;return}gs.hidden=false;gs.textContent=e&&e.code==='rate_limited'?'Kısa bir süre sonra tekrar dene.':'Görev üretilemedi; tekrar dene.';btn.disabled=false;btn.textContent=tl('sk_gen')}};

 const detail=id=>{const x=findTask(id);if(!x)return list();const y=TT(x),p=P(x),done=!!S.street[SK(x)];try{speechSynthesis.cancel()}catch(e){}

   stopL();toast(tl('no_voice'))};

   if(done)return;const miss=y.req.map((r,i)=>(!r.opt&&!reqOk(x,i))?r.l.replace(/[.。]\s*$/,''):null).filter(Boolean);$('[data-send]',b).disabled=miss.length>0;$('[data-why]',b).textContent=miss.length?tl('sk_missing')+' '+miss.join(', ')+'.':tl('sk_allset')};
  const head=r=>`<h3><span>${esc(r.l)}</span><span class="tag"></span></h3>${r.h?`<p class="hint">${esc(r.h)}</p>`:''}`;
  y.req.forEach((r,i)=>{const el=$(`[data-r="${i}"]`,b);
   if(r.k==='consent'){el.innerHTML=`<h3><span>${tl('consent')}</span><span class="tag"></span></h3><label class="cn" style="margin-top:8px"><input type="checkbox" ${p.consent[i]?'checked':''} ${done?'disabled':''}><span>${esc(r.l)}</span></label>`;$('input',el).onchange=e=>{p.consent[i]=e.target.checked;save();refresh()}}
   else if(r.k==='text'){el.innerHTML=head(r)+`<textarea ${done?'readonly':''} aria-label="${esc(r.l)}">${esc(p.text[i]||'')}</textarea><div class="cnt"></div>`;const ta=$('textarea',el),cnt=$('.cnt',el);const c=()=>cnt.textContent=tl('chars',{a:ta.value.trim().length,n:r.min});c();ta.oninput=()=>{p.text[i]=ta.value;save();c();refresh()}}

   y.req.forEach((r,i)=>{if(r.k!=='media')return;(p.media[i]||[]).filter(m=>m.ok).forEach(m=>{if(!(S.port||[]).some(z=>z.key===m.key)){S.port=S.port||[];S.port.unshift({id:'pp'+m.key,key:m.key,kind:m.kind,title:r.l+': '+y.t.slice(0,70),src:'sokak',dur:m.dur,date:today(),cv:false})}})});

 const mediaReq=(x,r,i,el,p,done,head,refresh)=>{p.media[i]=p.media[i]||[];const accepts=r.acc.split(',');const typeOk=ty=>accepts.some(a=>ty.startsWith(a.replace('*','')));

function IC(n,sz){const p=ICP[n]||ICP.sparkle;return `<svg class="ic" viewBox="0 0 24 24"${sz?` width="${sz}" height="${sz}"`:''} fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`}
const EMO_IC={'📡':'broadcast','🎓':'cap','🎬':'clapper','🎞':'reel','🪪':'user','🎙':'mic','🫁':'wind','👄':'lips','🎭':'masks','🙂':'face','🌀':'repeat','⚖':'yesno','📜':'prompter','🔴':'bolt','⚽':'ball','📺':'tv','🏟':'trophy','🗺':'pin','🎧':'headphones','🐿':'shapes','🦢':'landscape','📣':'megaphone','✍':'pen','🪶':'feather','📄':'idcard','📷':'camera','🎥':'video','📎':'clip','🔊':'speaker','✨':'sparkle','🎵':'music','🎸':'music','🎼':'music','🏆':'trophy','⚡':'bolt','☀':'sun','☾':'moon','✎':'pen','🔒':'lock'};
const EMO_RE=new RegExp('('+Object.keys(EMO_IC).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')[\\uFE0E\\uFE0F]?\\s?','u');
function iconizeText(n){const v=n.nodeValue;if(!v||!EMO_RE.test(v))return;const p=n.parentElement;if(!p||p.closest('option,select,textarea,script,style,svg,[data-noic]'))return;
 const frag=document.createDocumentFragment();let rest=v,m;
 while((m=rest.match(EMO_RE))){if(m.index)frag.appendChild(document.createTextNode(rest.slice(0,m.index)));const sp=document.createElement('span');sp.className='ice';const key=m[1];sp.innerHTML=IC(EMO_IC[key]);const after=rest.slice(m.index+m[0].length);sp.dataset.gap=(m[0].length>m[1].length&&after)?'1':'';frag.appendChild(sp);rest=after}
 if(rest)frag.appendChild(document.createTextNode(rest));n.replaceWith(frag)}
function iconize(root){if(!root)return;if(root.nodeType===3)return iconizeText(root);if(root.nodeType!==1)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const ns=[];while(w.nextNode())ns.push(w.currentNode);ns.forEach(iconizeText)}
new MutationObserver(ms=>{for(const mu of ms){if(mu.type==='characterData')iconizeText(mu.target);else mu.addedNodes.forEach(iconize)}}).observe(document.body,{subtree:true,childList:true,characterData:true});
const MOD_IC={videolar:'play',ses:'level',nefes:'wind',artikulasyon:'lips',duygu:'masks',g:null,mimik:'face',tekerleme:'repeat',evethayir:'yesno',prompter:'prompter',sondakika:'bolt',gol:'ball',haber:'tv',spor:'trophy',sokak:'pin',seslendirme:'headphones',animasyon:'shapes',belgesel:'landscape',reklam:'megaphone',sunum:'pen',siir:'feather',cv:'idcard'};
for(const id in MODS){const k=MOD_IC[id];MODS[id].i=k?IC(k):(id==='g'?'<span class="icg">ğ</span>':IC('sparkle'))}

function applyTheme(){const th=S.theme||'dark';document.documentElement.dataset.theme=th;const m=document.querySelector('meta[name=theme-color]');if(m)m.content=th==='dark'?'#0F0C22':'#F4F2FF';Yayin.setTheme(th==='dark')}
applyTheme();
iconize(document.body);
seedUI();render();if(!S.onboarded)onboard();else permGate();
